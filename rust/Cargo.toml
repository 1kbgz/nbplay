[package]
name = "nbplay"
version = "0.1.1"
authors = ["the nbplay authors <dev@1kbgz.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/1kbgz/nbplay"
description = "let's play!"

[lib]
name = "nbplay"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18"
midir = "0.11"